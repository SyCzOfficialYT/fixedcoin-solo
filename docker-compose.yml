services:
  fixedcoin-solo:
    build: .
    container_name: fixedcoin-solo
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "5050:5050"
      - "24768:24768"
    volumes:
      - fix-data:/data
    environment:
      - FIX_DATADIR=/data/fixedcoin
      - FIX_RPCUSER=fixrpc
      - FIX_RPCPASS=FixedcoinSoloAutoRpc_ChangeMeIfPublic
      - FIX_RPCPORT=24761
      - FIX_P2PPORT=24768
      - FIX_DASH_PORT=5050
      # MUST match stratum write path (/app/data/…)
      - STATS_PATH=/app/data/stats.json
      - EVENTS_PATH=/app/data/events.jsonl
      - STRATUM_LOG=/app/data/stratum.log
    shm_size: "1gb"

volumes:
  fix-data:
